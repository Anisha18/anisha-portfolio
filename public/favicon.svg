<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .favicon-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: bold;
        font-size: 52px;
        letter-spacing: -2px;
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="100" height="100" fill="#000000"/>
  
  <!-- Subtle accent circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
  
  <!-- AD text in cyan -->
  <text x="50" y="62" class="favicon-text" text-anchor="middle" fill="#00d4ff">
    AD
  </text>
</svg>